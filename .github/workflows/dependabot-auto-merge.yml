name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Dependabot PRs in the org repo only (not the mirror)
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'uib-ub/AI-NRE-System'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Minor/patch bumps of uv packages and GitHub Actions merge once the
      # required checks pass. Majors and pre-commit hook bumps (CI doesn't run
      # the hooks) still wait for a manual merge.
      - name: Enable auto-merge for minor and patch updates
        if: >-
          (startsWith(github.head_ref, 'dependabot/uv/') ||
           startsWith(github.head_ref, 'dependabot/github_actions/')) &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
