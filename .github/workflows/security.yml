name: Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Bandit and Safety
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project and security tools
        run: |
          uv pip install --system -e ".[security]"

      - name: Create report directory
        run: |
          mkdir -p reports

      - name: Run Bandit (SARIF for GitHub code scanning)
        run: |
          echo "::group::Bandit Security Scan"
          uv run bandit -r src/ \
            -f sarif \
            -o reports/bandit.sarif \
            -ll \
            || true
          echo "::endgroup::"

      - name: Upload Bandit SARIF to GitHub code scanning
        if: always() && hashFiles('reports/bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bandit.sarif
          category: bandit

      - name: Run Safety (JSON report)
        continue-on-error: true
        run: |
          echo "::group::Safety Vulnerability Check"
          uv run safety scan --output json > reports/safety.json
          echo "::endgroup::"

      - name: Upload raw reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 30

      - name: Check for high-severity Bandit issues
        if: always()
        shell: bash
        run: |
          echo "::group::Checking Bandit High Severity Issues"
          if [ -f reports/bandit.sarif ]; then
            HIGH_COUNT=$(python3 -c 'import json; from pathlib import Path; data = json.loads(Path("reports/bandit.sarif").read_text(encoding="utf-8")); print(sum(1 for run in data.get("runs", []) for result in run.get("results", []) if str(result.get("level", "")).lower() == "error"))')
            echo "High severity Bandit findings found: $HIGH_COUNT"
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::Found $HIGH_COUNT high severity Bandit findings"
              exit 1
            fi
          fi
          echo "::endgroup::"
