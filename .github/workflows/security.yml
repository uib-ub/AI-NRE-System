name: Security Scan

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Prevent concurrent runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For GitHub Security tab
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[security]"
      
      - name: Run Bandit security scanner
        run: |
          echo "::group::Bandit Security Scan"
          uv run bandit -r src/ \
            -f json \
            -o bandit-report.json \
            -ll \
            --exit-zero
          
          # Also output to terminal for GitHub Actions
          uv run bandit -r src/ \
            -ll \
            || true
          echo "::endgroup::"
      
      - name: Run Safety vulnerability scanner
        run: |
          echo "::group::Safety Vulnerability Check"
          # Use --save-json to save results to file
          uv run safety check \
            --save-json safety-report.json \
            --output json \
            || true
          
          # Display results in terminal
          uv run safety check \
            --output screen \
            || true
          echo "::endgroup::"
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30
      
      - name: Check for high-severity Bandit issues
        if: always()
        run: |
          echo "::group::Checking Bandit High Severity Issues"
          if [ -f bandit-report.json ]; then
            HIGH_SEVERITY=$(cat bandit-report.json | python3 -c "import sys, json; data = json.load(sys.stdin); print(len([r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']))")
            echo "High severity issues found: $HIGH_SEVERITY"
            
            if [ "$HIGH_SEVERITY" -gt 0 ]; then
              echo "::warning::Found $HIGH_SEVERITY high severity security issues"
            fi
          fi
          echo "::endgroup::"
