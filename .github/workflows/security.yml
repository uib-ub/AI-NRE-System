name: Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Bandit and Safety
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project and security tools
        run: |
          uv pip install --system -e ".[security]"

      - name: Create report directory
        run: |
          mkdir -p reports

      - name: Run Bandit (JSON report)
        run: |
          echo "::group::Bandit Security Scan"
          uv run bandit -r src/ \
            -f json \
            -o reports/bandit.json \
            -ll \
            || true
          echo "::endgroup::"

      - name: Run Safety (JSON report)
        continue-on-error: true
        run: |
          echo "::group::Safety Vulnerability Check"
          uv run safety scan --disable-optional-telemetry --output json > reports/safety.json || true
          echo "::endgroup::"

      - name: Upload raw reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 30

      - name: Check for high-severity Bandit issues
        if: always()
        shell: bash
        run: |
          echo "::group::Checking Bandit High Severity Issues"
          if [ -f reports/bandit.json ]; then
            HIGH_COUNT=$(python3 -c 'import json; from pathlib import Path; data = json.loads(Path("reports/bandit.json").read_text(encoding="utf-8")); print(len([r for r in data.get("results", []) if r.get("issue_severity", "").upper() == "HIGH"]))')
            echo "High severity Bandit findings found: $HIGH_COUNT"
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::Found $HIGH_COUNT high severity Bandit findings"
              exit 1
            fi
          fi
          echo "::endgroup::"
